  - M3_molecular_GNN
  neural_prediction: frozen_arithmetic_mean_three_seeds
  primary_metric: mean_compound_measured_delta_RMSE
  contrasts:
  - M3_minus_M1
  - M3_minus_B1
  contrast_interpretation: paired_estimates_pointwise_CIs_not_joint_superiority_test
  score_truth: measured_delta_not_PCA_reconstruction
