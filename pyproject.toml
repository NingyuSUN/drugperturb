[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drugperturb"
version = "0.1.0"
description = "Controlled chemical structure to transcriptional response prediction"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "scipy", "pandas", "scikit-learn", "rdkit", "h5py", "anndata", "pyarrow", "pyyaml", "requests", "matplotlib", "torch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
