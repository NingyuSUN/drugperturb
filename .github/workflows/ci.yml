name: CPU tests and synthetic workflow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MPLBACKEND: Agg
      NXF_ANSI_LOG: 'false'
    steps:
      # Official tag refs verified using api.github.com/repos/actions/*/git/ref/tags/...
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: locks/python-cpu.txt

      - name: Install exact CPU dependencies
        run: |
          mkdir -p ci-evidence
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu -r locks/python-cpu.txt
          python -m pip check
          python -m pip freeze > ci-evidence/python-freeze.txt
          python --version > ci-evidence/python-version.txt

      - name: Run meaningful Python tests with synthetic fixtures
        run: python -m pytest -q --junitxml=ci-evidence/pytest.xml

      - name: Install checksum-verified Java and Nextflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/drugperturb-ci/bin" "$RUNNER_TEMP/drugperturb-ci/java"
          curl --fail --location --retry 3 \
            'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jre_x64_linux_hotspot_21.0.12.1_1.tar.gz' \
            --output "$RUNNER_TEMP/drugperturb-ci/java.tar.gz"
          printf '%s  %s\n' '2413149700df0f7d440500a84a8f764c535f21e5a5e87d38328b64eec2c5b500' "$RUNNER_TEMP/drugperturb-ci/java.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/drugperturb-ci/java.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/drugperturb-ci/java"
          curl --fail --location --retry 3 \
            'https://github.com/nextflow-io/nextflow/releases/download/v25.10.2/nextflow-25.10.2-dist' \
            --output "$RUNNER_TEMP/drugperturb-ci/bin/nextflow"
          printf '%s  %s\n' '59c6f48fce6139157b2e8a28fdca8166bc502a22d9ef1a0a70065ecc9c3ae4a3' "$RUNNER_TEMP/drugperturb-ci/bin/nextflow" | sha256sum --check
          chmod +x "$RUNNER_TEMP/drugperturb-ci/bin/nextflow"
          printf 'JAVA_HOME=%s\n' "$RUNNER_TEMP/drugperturb-ci/java" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/drugperturb-ci/java/bin" "$RUNNER_TEMP/drugperturb-ci/bin" >> "$GITHUB_PATH"

      - name: Run Nextflow synthetic smoke with standard Linux metrics
        shell: bash
        run: |
          set -euo pipefail
          java -version 2> ci-evidence/java-version.txt
          nextflow -version > ci-evidence/nextflow-version.txt
          task_python=$(python -c 'import sys; print(sys.executable)')
          nextflow -C "$PWD/nextflow.config" run "$PWD/main.nf" \
            -profile test --project_root "$PWD" --python "$task_python" \
            --source_commit "$GITHUB_SHA" --resource_metrics true \
            --outdir "$PWD/work/ci-smoke" -work-dir "$PWD/work/nf-ci"
          python scripts/smoke_pipeline.py --verify-output "$PWD/work/ci-smoke/snapshot"

      - name: Preserve test and workflow evidence on success or failure
        if: always()
        shell: bash
        run: |
          mkdir -p ci-evidence
          date -u +%FT%TZ > ci-evidence/collected-utc.txt
          if [[ -f .nextflow.log ]]; then cp .nextflow.log ci-evidence/nextflow.log; fi
          if [[ -d work/ci-smoke ]]; then tar -chzf ci-evidence/nextflow-results.tar.gz work/ci-smoke; fi
          if [[ -d work/nf-ci ]]; then tar -czf ci-evidence/nextflow-task-work.tar.gz work/nf-ci; fi
          find ci-evidence -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > ci-evidence/SHA256SUMS

      - name: Upload CI receipts, trace, report and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: software-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 14

# No public expression download, real-data workflow mode, AWS access or secrets.
# The synthetic smoke's tiny model fits validate software, not biological accuracy.
# Hosted CI has not run merely because this configuration exists locally.
